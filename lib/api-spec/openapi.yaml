openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Google Ads Search Query Analysis API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: rules
    description: Account analysis rules
  - name: analyses
    description: Search query analyses
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /rules:
    get:
      operationId: listRules
      tags: [rules]
      summary: List all saved rule sets
      responses:
        "200":
          description: List of rule sets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RuleSet"
    post:
      operationId: createRuleSet
      tags: [rules]
      summary: Create a new rule set
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleSetInput"
      responses:
        "201":
          description: Created rule set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleSet"

  /rules/{id}:
    get:
      operationId: getRuleSet
      tags: [rules]
      summary: Get a rule set by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rule set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleSet"
        "404":
          description: Not found
    put:
      operationId: updateRuleSet
      tags: [rules]
      summary: Update a rule set
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleSetInput"
      responses:
        "200":
          description: Updated rule set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleSet"
    delete:
      operationId: deleteRuleSet
      tags: [rules]
      summary: Delete a rule set
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /analyses:
    get:
      operationId: listAnalyses
      tags: [analyses]
      summary: List past analyses
      responses:
        "200":
          description: List of analyses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnalysisSummary"
    post:
      operationId: createAnalysis
      tags: [analyses]
      summary: Run a new search query analysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisInput"
      responses:
        "201":
          description: Created analysis with results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"

  /analyses/{id}:
    delete:
      operationId: deleteAnalysis
      tags: [analyses]
      summary: Delete an analysis by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
    get:
      operationId: getAnalysis
      tags: [analyses]
      summary: Get a specific analysis with full results
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Analysis with results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "404":
          description: Not found

  /analyses/{id}/chat:
    post:
      operationId: chatWithAnalysis
      tags: [analyses]
      summary: Chat with AI to modify analysis results
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Modified analysis results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "404":
          description: Not found

  /analyses/stats:
    get:
      operationId: getAnalysisStats
      tags: [analyses]
      summary: Get aggregate stats across all analyses
      responses:
        "200":
          description: Stats summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    RuleSet:
      type: object
      required: [id, name, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        accountName:
          type: ["string", "null"]
        competitorBrands:
          type: array
          items:
            type: string
        excludePatterns:
          type: array
          items:
            type: string
        customRules:
          type: array
          items:
            type: string
        minConversionsForNewKeyword:
          type: integer
        activeKeywords:
          type: ["string", "null"]
          description: Saved active keywords for this account profile
        landingPageUrl:
          type: ["string", "null"]
          description: Saved landing page URL for this account profile
        targetLocations:
          type: ["string", "null"]
          description: Saved target service locations for this account profile
        relevantBrandTerms:
          type: ["string", "null"]
          description: Saved brand terms that should always be considered relevant
        createdAt:
          type: string
        updatedAt:
          type: string

    RuleSetInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        accountName:
          type: string
        competitorBrands:
          type: array
          items:
            type: string
        excludePatterns:
          type: array
          items:
            type: string
        customRules:
          type: array
          items:
            type: string
        minConversionsForNewKeyword:
          type: integer
        activeKeywords:
          type: string
          description: Active keywords to save with this account profile
        landingPageUrl:
          type: string
          description: Landing page URL to save with this account profile
        targetLocations:
          type: string
          description: Target service locations to save with this account profile
        relevantBrandTerms:
          type: string
          description: Comma-separated brand names that should always be considered relevant

    AnalysisInput:
      type: object
      required: [activeKeywords, searchTerms]
      properties:
        name:
          type: string
        ruleSetId:
          type: ["integer", "null"]
        landingPageUrl:
          type: string
          description: Optional URL of the landing page/website to scan for relevance context
        targetLocations:
          type: string
          description: Optional comma-separated target service locations (cities, regions). Terms outside these areas will be flagged as irrelevant.
        activeKeywords:
          type: string
          description: Newline or comma separated list of active keywords with their match types and ad groups
        searchTerms:
          type: string
          description: Newline or tab-separated search term data (term, impressions, clicks, conversions, cost)
        competitorBrands:
          type: array
          items:
            type: string
        excludePatterns:
          type: array
          items:
            type: string
        customRules:
          type: array
          items:
            type: string
        minConversionsForNewKeyword:
          type: integer
        relevantBrandTerms:
          type: string
          description: Comma-separated brand names that should always be considered relevant

    SearchTermResult:
      type: object
      required: [searchTerm, relevance, reason, addLevel, addAsKeyword, suggestedAdGroup, isCompetitor]
      properties:
        searchTerm:
          type: string
        impressions:
          type: ["integer", "null"]
        clicks:
          type: ["integer", "null"]
        conversions:
          type: ["number", "null"]
        cost:
          type: ["number", "null"]
        relevance:
          type: string
          enum: [Relevant, Irrelevant]
        reason:
          type: string
        addLevel:
          type: string
          enum: [Campaign, Ad Group, None]
        addAsKeyword:
          type: boolean
        suggestedAdGroup:
          type: ["string", "null"]
        isCompetitor:
          type: boolean
        matchedKeyword:
          type: ["string", "null"]
        outOfAreaLocation:
          type: ["string", "null"]
          description: The specific location word/phrase in the search term that is outside the target service area
        relevanceScore:
          type: ["number", "null"]
          description: AI-assessed relevance score from 0-100. Low scores (0-30) = broad/borderline terms. High scores (70-100) = strong match with active keywords.
        suggestedNegativeTerm:
          type: ["string", "null"]
          description: The specific irrelevant word/phrase to add as a negative keyword when the term contains a brand name + an irrelevant modifier (e.g., "how to" or "careers"). NOT the full search term. Only set when the term contains BOTH a brand name AND an irrelevant modifier.
        translation:
          type: ["string", "null"]
          description: English translation of the search term if it is not in English. Used for relevance analysis against the active keywords.

    Analysis:
      type: object
      required: [id, name, status, results, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          type: string
          enum: [pending, processing, completed, failed]
        ruleSetId:
          type: ["integer", "null"]
        activeKeywords:
          type: string
          description: The raw active keywords string used for this analysis
        searchTerms:
          type: string
          description: The raw search terms string used for this analysis
        targetLocations:
          type: ["string", "null"]
          description: Target service locations used for this analysis
        landingPageUrl:
          type: ["string", "null"]
          description: Landing page URL used for this analysis
        relevantBrandTerms:
          type: ["string", "null"]
          description: Brand terms that should always be considered relevant for this analysis
        competitorBrands:
          type: array
          items:
            type: string
        excludePatterns:
          type: array
          items:
            type: string
        customRules:
          type: array
          items:
            type: string
        minConversionsForNewKeyword:
          type: integer
        totalTerms:
          type: integer
        relevantCount:
          type: integer
        irrelevantCount:
          type: integer
        newKeywordCount:
          type: integer
        competitorCount:
          type: integer
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchTermResult"
        errorMessage:
          type: ["string", "null"]
        explanation:
          type: ["string", "null"]
          description: Explanation of the last AI chat modification, if any
        createdAt:
          type: string

    AnalysisSummary:
      type: object
      required: [id, name, status, totalTerms, relevantCount, irrelevantCount, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          type: string
          enum: [pending, processing, completed, failed]
        ruleSetId:
          type: ["integer", "null"]
        totalTerms:
          type: integer
        relevantCount:
          type: integer
        irrelevantCount:
          type: integer
        newKeywordCount:
          type: integer
        competitorCount:
          type: integer
        explanation:
          type: string
          description: Explanation of the last AI chat modification, if any
        createdAt:
          type: string

    AnalysisStats:
      type: object
      required: [totalAnalyses, totalTermsAnalyzed, avgRelevanceRate, topCompetitors]
      properties:
        totalAnalyses:
          type: integer
        totalTermsAnalyzed:
          type: integer
        avgRelevanceRate:
          type: number
        topCompetitors:
          type: array
          items:
            type: string

    ChatRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Natural language request to modify the analysis results (e.g., Add rule - flag all terms with 'how to' as irrelevant)
        additionalContext:
          type: string
          description: Optional additional context to help the AI understand the request

    ChatResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchTermResult"
        explanation:
          type: string
          description: Explanation of the changes made by the AI
